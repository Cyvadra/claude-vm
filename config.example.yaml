# claude-vm 部署設定
# 複製為 config.yaml 後修改。config.yaml 不進版本控制。
# 路徑支援 ~ 與 $HOME，渲染時展開。

vm_defaults:
  vcpu: 4
  memory_gb: 8
  # qcow2 與映像快取的位置。稀疏檔，實際佔用遠小於 disk_size_gb。
  disk_dir: /mnt/persistant/claude-vm
  disk_size_gb: 60
  image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img

network:
  name: approx-vm
  bridge: virbr-approx
  # 網段必須與宿主既有網段不衝突；`claude-vm check` 會驗證。
  subnet: 10.66.0.0/24
  gateway: 10.66.0.1
  dhcp_start: 10.66.0.100
  dhcp_end: 10.66.0.120
  # 閘道 MAC。刻意不用 52:54:00（QEMU 的 OUI），避免暴露虛擬化平台。
  bridge_mac: "f0:9f:c2:aa:bb:cc"
  # 宿主所在區網。VM 不得橫向移動到此網段。
  host_lan: 192.168.1.0/24

gateway:
  # 全域預設，可被每台 VM 的 upstream 覆寫。
  # 支援 http:// 與 socks5://，可帶帳密：http://user:pass@host:port
  # 注意：approx 的 listener 是「單節點直通」，不含分流規則。
  # 本專案不做國內外分流，全量走節點。
  upstream: http://us-usa.approx.internal:17890

  # DNS 上游。預設經代理做 DoH，避免解析結果洩漏真實出口。
  dns_upstream: https://1.1.1.1/dns-query

  # QUIC（UDP/443）處理。
  # auto：上游是 HTTP 代理時主動 reject，讓瀏覽器快速回退到 TCP；socks5 則放行。
  drop_quic: auto

  # 每台 VM 的網關埠位由此派生：redir = base+i*10+2、tproxy = +3、dns = +4
  port_base: 17890
  controller_base: 9099

  # 對 VM 開放的宿主服務端口，同端口轉發到 127.0.0.1。
  host_services: [3306, 5432, 6379, 8123, 9000]

  # mihomo 執行檔。本倉庫不安裝代理，需自備：
  # 可用 approx-client 已下載的核心，或自官方 release 取得。
  core_bin: ~/.local/share/approx-client/bin/mihomo

guest:
  user: claude
  # 必須與宿主檔案擁有者一致，virtiofs 的 passthrough 模式才能正確映射
  uid: 1000
  # 客體時區。需存在於 tzdata（亞特蘭大屬 America/New_York）。
  timezone: America/New_York

# 共用掛載：所有 VM 都掛同一份工具鏈與快取。
# 可寫字串簡寫，target 會依慣例推導（~/x → /home/<user>/x，絕對路徑原樣）。
#
# 以下路徑一律禁止掛載（由 render 強制拒絕）：
#   ~/.claude  ~/.config/claude  ~/.ssh  ~/.config/gh
#   ~/.aws     ~/.config/gcloud  ~/.netrc  ~/.git-credentials
# 這些承載帳號層或宿主層身分，掛進去等於把多台機器綁成同一身分。
mounts:
  # tag 就是客體 virtiofs 的 target 名稱，會寫進 fstab，必須穩定。
  - { source: /usr/local/go,     tag: go-root }       # GOROOT（root 擁有，客體實際唯讀）
  - { source: ~/.nvm,            tag: nvm }           # Node 版本管理器
  - { source: ~/go,              tag: gopath }        # GOPATH / GOMODCACHE
  - { source: ~/.cache/go-build, tag: gocache }       # GOCACHE
  - { source: ~/.npm,            tag: npm-cache }     # npm cache
  - { source: ~/programs,        tag: programs }
  - { source: ~/.kube,           tag: kube }
  - { source: ~/.docker,         tag: docker-config }

vms:
  # 每台 VM 有獨立的網關實例與上游，因此出口 IP 各自不同。
  # mac 省略時由名稱派生（f0:9f:c2 開頭，不用 QEMU 的 OUI）。
  # ip 省略時由 dhcp_start 起算。
  - name: claude-vm
    upstream: http://us-usa.approx.internal:17890
    mounts:
      - { source: ~/workspace, tag: workspace }   # 工作目錄：每台一份，避免兩個 agent 改同一棵樹

  # - name: claude-vm-2
  #   upstream: http://uk-aws-direct.approx.internal:17890
  #   mounts:
  #     - ~/workspace-2
